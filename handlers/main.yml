# code: language=ansible
# vim: set filetype=yaml.ansible :
---
- name: "docker compose reload vmalert"
  ansible.builtin.include_tasks:
    file: reload_vmalert.yml
  when:
    - victorialogs_docker_vmalert_enabled
    - >-
      victorialogs_docker_vmalert_validate_result.rc | default(1) == 0 or
      victorialogs_docker_vmalert_validate_result.skipped | default(false)
