# code: language=ansible
# vim: set filetype=yaml.ansible :
---
- name: Converge
  hosts: all
  vars_files:
    - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/vars/main.yml"
  tasks:
    - name: update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 86400

    - name: install docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-cli

    - name: start docker
      ansible.builtin.systemd:
        name: docker
        state: started

    - name: "include victorialogs_docker role"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
